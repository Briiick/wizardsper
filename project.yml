name: Wizard
options:
  bundleIdPrefix: com.bricken
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    # A stable signing identity keeps the TCC grants (Microphone, Accessibility,
    # Input Monitoring) across rebuilds. Ad-hoc signing changes the cdhash every
    # build, which makes macOS re-prompt for every permission each time.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: ""
    OTHER_CODE_SIGN_FLAGS: "--timestamp=none"

targets:
  Wizard:
    type: application
    platform: macOS
    sources:
      - path: Sources/WizardKit
      - path: Sources/WizardApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bricken.wizard
        PRODUCT_NAME: Wizard
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Wizard.entitlements
        ENABLE_APP_SANDBOX: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreML.framework
      - sdk: Accelerate.framework
