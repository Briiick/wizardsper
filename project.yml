name: Wizardsper
options:
  bundleIdPrefix: com.bricken
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # A stable signing identity keeps the TCC grants (Microphone, Accessibility,
    # Input Monitoring) across rebuilds. Ad-hoc signing changes the cdhash every
    # build, which makes macOS re-prompt for every permission each time.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: ""
    OTHER_CODE_SIGN_FLAGS: "--timestamp=none"

targets:
  # Split out as its own module so the app target can `import WizardsperKit`, and so
  # the CLI harness and the unit tests build the exact same code the app runs.
  WizardsperKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/WizardsperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bricken.wizardsper.kit
        PRODUCT_NAME: WizardsperKit
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/Frameworks"
        SKIP_INSTALL: NO
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreML.framework
      - sdk: Accelerate.framework
      - sdk: AppKit.framework

  Wizardsper:
    type: application
    platform: macOS
    sources:
      - path: Sources/WizardsperApp
      - path: Resources/Wizardsper.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bricken.wizardsper
        PRODUCT_NAME: Wizardsper
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Wizardsper.entitlements
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: WizardsperKit
        embed: true
        codeSign: true
      - sdk: ServiceManagement.framework
